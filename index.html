<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d11"><title>LEGACY Wrestling Cards</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="styles.css?v=0.5.0"></head><body>
<div id="app"><section id="menu" class="screen active"><img class="logo" src="assets/branding/lpw-logo-main-menu-1200.webp" alt="LEGACY Wrestling Cards"><h1>WRESTLING CARDS</h1><p class="lead">A tactical card-based wrestling match.</p><button id="startBtn" class="primary">Exhibition 1v1</button><div class="version">v0.5.0</div></section>
<section id="select" class="screen"><header><button class="ghost" data-back="menu">← Back</button><h2>Choose Your Wrestler</h2></header><div id="roster" class="roster"></div></section>
<section id="match" class="screen"><header class="matchHeader"><button id="quitBtn" class="ghost">Quit</button><div id="phaseBadge" class="phase">Opening</div><div id="turnLabel">Your turn</div></header><div class="arena">
<div class="fighter player"><img id="playerPortrait"><div><h2 id="playerName"></h2><div class="meterRow"><span>Health</span><b id="playerHealthText"></b></div><div class="meter"><i id="playerHealthBar"></i></div><div class="meterRow"><span>Momentum</span><b id="playerMomentumText"></b></div><div class="meter momentum"><i id="playerMomentumBar"></i></div></div></div>
<div class="centre"><div class="control"><span id="playerControl">50</span><div class="controlTrack"><i id="controlBar"></i></div><span id="cpuControl">50</span></div><div id="position" class="position">Both wrestlers standing</div><div id="crowd" class="crowd">Crowd 0</div></div>
<div class="fighter cpu"><img id="cpuPortrait"><div><h2 id="cpuName"></h2><div class="meterRow"><span>Health</span><b id="cpuHealthText"></b></div><div class="meter"><i id="cpuHealthBar"></i></div><div class="meterRow"><span>Momentum</span><b id="cpuMomentumText"></b></div><div class="meter momentum"><i id="cpuMomentumBar"></i></div></div></div></div>
<div id="message" class="message"></div><div class="pileZone"><div id="playedPile" class="playedPile"><div class="pileEmpty">Played pile</div></div></div><div class="handHeader"><div><h3 id="handTitle">Your Attack</h3><p id="handHelp">Keep playing until your opponent reverses you.</p></div><div class="handActions"><button id="pinBtn" class="primary compact" hidden>Pin / Pass</button><button id="redrawBtn" class="ghost">Keep Hand</button></div></div><div id="hand" class="hand"></div><details class="logWrap"><summary>Match Feed</summary><div id="log" class="log"></div></details></section>
<section id="result" class="screen"><div class="resultCard"><img id="winnerPortrait"><div class="eyebrow">Match Result</div><h1 id="winnerName"></h1><p id="resultSummary"></p><div id="rating" class="rating"></div><button id="rematchBtn" class="primary">Rematch</button><button class="ghost" data-back="menu">Main Menu</button></div></section></div>
<script src="data.js?v=0.5.0"></script><script src="game.js?v=0.5.0"></script><script src="update-manager.js?v=0.5.0"></script></body></html>
